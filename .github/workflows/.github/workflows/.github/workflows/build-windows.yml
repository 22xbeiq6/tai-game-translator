
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build application
        run: |
          pyinstaller --noconfirm --clean --windowed --name TaiGameTranslatorUltimate --collect-all easyocr --collect-all torch --collect-all torchvision --collect-all cv2 main.py

      - name: Package portable folder
        run: |
          Compress-Archive -Path dist/TaiGameTranslatorUltimate -DestinationPath TaiGameTranslator-Ultimate-Windows.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: TaiGameTranslator-Ultimate-Windows
          path: TaiGameTranslator-Ultimate-Windows.zip

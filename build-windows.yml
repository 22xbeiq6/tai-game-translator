name: Build Ultimate Windows Portable
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build portable folder
        run: |
          pyinstaller --noconfirm --clean --windowed --name TaiGameTranslatorUltimate --collect-all easyocr --collect-all torch --collect-all torchvision --collect-all cv2 --collect-all scipy --collect-all skimage --collect-all numpy --collect-all PySide6 --collect-all pynput --hidden-import=python_bidi --hidden-import=pyclipper src/main.py
      - name: Zip portable folder
        run: Compress-Archive -Path dist/TaiGameTranslatorUltimate -DestinationPath TaiGameTranslator-Ultimate-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TaiGameTranslator-Ultimate-Windows
          path: TaiGameTranslator-Ultimate-Windows.zip
